app-id: io.github.andunieee.SimpleCalendar
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: simple-calendar
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: simple-calendar
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      # skia-bindings downloads its prebuilt binaries and cargo fetches the crates
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/simple-calendar/cargo
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/simple-calendar -t /app/bin
      - install -Dm644 packaging/io.github.andunieee.SimpleCalendar.desktop -t /app/share/applications
      - install -Dm644 packaging/io.github.andunieee.SimpleCalendar.metainfo.xml -t /app/share/metainfo
      - install -Dm644 packaging/io.github.andunieee.SimpleCalendar.svg -t /app/share/icons/hicolor/scalable/apps
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - .flatpak-builder
          - build-dir
          - repo
